server.address=${BIND_ADDRESS:127.0.0.1}
server.port=${PORT:8087}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/maintenance;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
spring.jackson.serialization.indent-output=true
server.error.include-message=never
spring.web.resources.cache.period=0
agent.dsh-url=${DSH_RUNTIME_URL:http://127.0.0.1:8117}
agent.dsh-token=${DSH_RUNTIME_TOKEN:}
agent.dsh-enabled=${DSH_ENABLED:false}
agent.dsh-tool-token=${DSH_TOOL_TOKEN:}
agent.admin-token=${ADMIN_TOKEN:}
