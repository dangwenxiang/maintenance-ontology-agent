server.address=${BIND_ADDRESS:127.0.0.1}
server.port=${PORT:8087}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/maintenance;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
spring.jackson.serialization.indent-output=true
server.error.include-message=never
spring.web.resources.cache.period=0
agent.model-url=${MODEL_BASE_URL:}
agent.model-key=${MODEL_API_KEY:}
agent.model-name=${MODEL_NAME:}
agent.admin-token=${ADMIN_TOKEN:}
